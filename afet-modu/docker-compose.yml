version: "3.9"

services:
  # ─── INFRASTRUCTURE ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afet_pass}
      POSTGRES_DB: afet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── MICROSERVICES ────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-afet}:${POSTGRES_PASSWORD:-afet_pass}@postgres:5432/afet
      JWT_SECRET: ${JWT_SECRET:-super_secret_change_in_prod}
      JWT_EXPIRE_MINUTES: 60
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-service:
    build: ./core-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-afet}:${POSTGRES_PASSWORD:-afet_pass}@postgres:5432/afet
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-400}
      SEED_RANDOM_SEED: 42
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  disaster-service:
    build: ./disaster-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-afet}:${POSTGRES_PASSWORD:-afet_pass}@postgres:5432/afet
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REDIS_URL: redis://redis:6379
      EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-kafka}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-service:
    build: ./agent-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-afet}:${POSTGRES_PASSWORD:-afet_pass}@postgres:5432/afet
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REDIS_URL: redis://redis:6379
      EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-kafka}
      CORE_SERVICE_URL: http://core-service:8002
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL_PLANNER: ${MODEL_PLANNER:-openai/gpt-4o-mini}
      MODEL_COMMUNICATOR: ${MODEL_COMMUNICATOR:-openai/gpt-4o-mini}
      AGENT_MAX_STEPS: 8
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-service:
        condition: service_healthy

  # ─── FRONTEND ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost/api
      NEXT_PUBLIC_SSE_URL: http://localhost/api/agent/stream
    depends_on:
      - auth-service
      - core-service
      - disaster-service
      - agent-service

  # ─── GATEWAY ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - core-service
      - disaster-service
      - agent-service
      - frontend

volumes:
  pgdata:
