worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream auth    { server auth-service:8001; }
    upstream core    { server core-service:8002; }
    upstream disaster { server disaster-service:8003; }
    upstream agent   { server agent-service:8004; }
    upstream frontend { server frontend:3000; }

    # Hız sınırı: afet anında korunma
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    server {
        listen 80;

        # SSE için timeout uzat
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/core/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://core/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/disaster/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://disaster/disaster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/agent/ {
            proxy_pass http://agent/agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # SSE için gerekli
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
